<!doctype html>

    <!-- SEO URLs: set SITE_HOST in src/seo/siteConfig.js (TODO deploy) — injected at build/dev -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var hash = location.hash;
        if (hash && hash !== "#" && hash !== "#top") {
          window.__yoStartHash = hash;
          history.replaceState(null, "", location.pathname + location.search);
        }
        window.scrollTo(0, 0);

        /* Phone browser chrome changes innerHeight while scrolling. Freeze the
           viewport unit so pinned sections don't reflow and shake. */
        var yoWidth = window.innerWidth;
        /* Pinned stages must cover the screen with the toolbar collapsed too,
           or the section underneath shows through a strip at the bottom. */
        var largeViewportHeight = function () {
          var root = document.documentElement;
          var probe = document.createElement("div");
          probe.style.cssText =
            "position:fixed;top:0;left:0;width:0;height:100vh;height:100lvh;visibility:hidden;pointer-events:none";
          root.appendChild(probe);
          var height = probe.offsetHeight;
          root.removeChild(probe);
          return Math.max(height || 0, window.innerHeight);
        };
        var syncYoViewport = function () {
          var root = document.documentElement;
          if (window.innerWidth > 767) {
            root.style.removeProperty("--yo-vv");
            root.style.removeProperty("--yo-lvh");
            return;
          }
          root.style.setProperty("--yo-vv", Math.round(window.innerHeight) + "px");
          root.style.setProperty("--yo-lvh", Math.round(largeViewportHeight()) + "px");
        };
        syncYoViewport();
        window.addEventListener("resize", function () {
          var next = window.innerWidth;
          if (next <= 767 && Math.abs(next - yoWidth) <= 1) return;
          yoWidth = next;
          syncYoViewport();
        });
      })();
    </script>
