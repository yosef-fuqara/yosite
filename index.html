<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- SEO URLs: set SITE_HOST in src/seo/siteConfig.js (TODO deploy) — injected at build/dev -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%SITE_URL%" />

    <title>YoSite</title>
    <meta name="description" content="%META_DESCRIPTION%" />
    <meta name="keywords" content="%META_KEYWORDS%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="%SITE_NAME%" />

    <link rel="alternate" hreflang="en" href="%SITE_URL%" />
    <link rel="alternate" hreflang="he" href="%SITE_URL%" />
    <link rel="alternate" hreflang="ar" href="%SITE_URL%" />
    <link rel="alternate" hreflang="ru" href="%SITE_URL%" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%" />

    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%META_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%META_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <script type="application/ld+json">
%JSON_LD%
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@300;400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#020203] text-gray-300 antialiased overflow-x-hidden selection:bg-violet-500/30 selection:text-violet-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
