<!doctype html>
<html lang="en" class="scroll-smooth yo-intro-pending">
  <head>
    <!-- SEO URLs: set SITE_HOST in src/seo/siteConfig.js (TODO deploy) — injected at build/dev -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var hash = location.hash;
        if (hash && hash !== "#" && hash !== "#top") {
          window.__yoStartHash = hash;
          history.replaceState(null, "", location.pathname + location.search);
        }
        window.scrollTo(0, 0);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/yosite-intro.glb" as="fetch" crossorigin="anonymous" />
    <link rel="canonical" href="%SITE_URL%" />

    <title>YoSite</title>
    <meta name="description" content="%META_DESCRIPTION%" />
    <meta name="keywords" content="%META_KEYWORDS%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="%SITE_NAME%" />

    <link rel="alternate" hreflang="en" href="%SITE_URL%" />
    <link rel="alternate" hreflang="he" href="%SITE_URL%" />
    <link rel="alternate" hreflang="ar" href="%SITE_URL%" />
    <link rel="alternate" hreflang="ru" href="%SITE_URL%" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%" />

    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%META_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="he_IL" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%META_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <script type="application/ld+json">
%JSON_LD%
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html.yo-intro-pending,
      html.yo-intro-pending body {
        background: #000000 !important;
        overflow: hidden;
      }
      #yo-intro-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #000000;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-white text-black antialiased overflow-x-clip selection:bg-black/15 selection:text-black">
    <div id="yo-intro-boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
